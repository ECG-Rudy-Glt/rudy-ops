name: Build & Deploy Backend

on:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        run: |
          if [ -d .git ]; then
            git fetch origin main && git reset --hard origin/main
          else
            git clone https://forgejo.home.lab.rudy/rudy/rudy-ops.git .
          fi

      - name: Login to Forgejo registry
        run: |
          echo "${{ secrets.FORGEJO_REGISTRY_TOKEN }}" | \
            docker login forgejo.home.lab.rudy -u rudy --password-stdin

      - name: Build & push image
        run: |
          IMAGE=forgejo.home.lab.rudy/rudy/rudy-ops-backend
          docker build -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" backend/
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

      # Déployé sur lxc-portfolio (10.0.20.15), en 3e conteneur à côté de "portfolio" (80) et
      # "rudy-ops" (8081) — même hôte que le frontend, cf. deploy.yml. Port hôte 8082 (celui
      # exposé par backend/Dockerfile). Secrets applicatifs en repo secrets Forgejo Actions,
      # copie de secret/homelab/rudy-ops dans OpenBao (source de vérité) — voir
      # Documentation/DID.md du repo HOMELAB pour le détail du déploiement.
      - name: Deploy to lxc-portfolio
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          VIKUNJA_API_URL: ${{ secrets.VIKUNJA_API_URL }}
          VIKUNJA_API_TOKEN: ${{ secrets.VIKUNJA_API_TOKEN }}
          VIKUNJA_PROJECT_ID: ${{ secrets.VIKUNJA_PROJECT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          install -m 600 /dev/null /tmp/deploy_key
          echo "$DEPLOY_KEY" > /tmp/deploy_key
          ssh -i /tmp/deploy_key \
              -o StrictHostKeyChecking=no \
              root@10.0.20.15 "
            docker pull forgejo.home.lab.rudy/rudy/rudy-ops-backend:latest &&
            docker stop rudy-ops-backend 2>/dev/null || true &&
            docker rm   rudy-ops-backend 2>/dev/null || true &&
            docker run -d \
              --name rudy-ops-backend \
              --restart unless-stopped \
              -p 8082:8082 \
              -e SMTP_HOST='$SMTP_HOST' \
              -e SMTP_PORT='$SMTP_PORT' \
              -e SMTP_USER='$SMTP_USER' \
              -e SMTP_PASSWORD='$SMTP_PASSWORD' \
              -e NOTIFY_EMAIL='$NOTIFY_EMAIL' \
              -e VIKUNJA_API_URL='$VIKUNJA_API_URL' \
              -e VIKUNJA_API_TOKEN='$VIKUNJA_API_TOKEN' \
              -e VIKUNJA_PROJECT_ID='$VIKUNJA_PROJECT_ID' \
              -e GEMINI_API_KEY='$GEMINI_API_KEY' \
              -e TELEGRAM_BOT_TOKEN='$TELEGRAM_BOT_TOKEN' \
              -e TELEGRAM_CHAT_ID='$TELEGRAM_CHAT_ID' \
              forgejo.home.lab.rudy/rudy/rudy-ops-backend:latest
          "
          rm -f /tmp/deploy_key
